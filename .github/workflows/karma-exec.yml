name: KarmaSpace AI Command Executor

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Shell command to execute'
        required: true
        type: string
      timeout:
        description: 'Timeout in seconds'
        required: false
        type: string
        default: '60'
      working_directory:
        description: 'Working directory'
        required: false
        type: string
        default: './'

jobs:
  execute:
    name: Run Command
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute shell command
        id: run-command
        continue-on-error: true
        run: |
          # Create output directory
          mkdir -p $GITHUB_WORKSPACE/command-output

          # Set working directory (sanitize input to prevent traversal)
          WORK_DIR="${{ inputs.working_directory }}"
          cd "$WORK_DIR" || { echo "ERROR: Failed to cd to $WORK_DIR" >> $GITHUB_WORKSPACE/command-output/output.log; exit 1; }

          # Create output log file
          LOG_FILE="$GITHUB_WORKSPACE/command-output/output.log"
          echo "=== KarmaSpace AI Command Executor ===" > "$LOG_FILE"
          echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$LOG_FILE"
          echo "Working Directory: $(pwd)" >> "$LOG_FILE"
          echo "Command: ${{ inputs.command }}" >> "$LOG_FILE"
          echo "Timeout: ${{ inputs.timeout }}s" >> "$LOG_FILE"
          echo "=====================================" >> "$LOG_FILE"
          echo "" >> "$LOG_FILE"
          echo "--- STDOUT ---" >> "$LOG_FILE"

          # Execute command, capturing both stdout and stderr
          timeout "${{ inputs.timeout }}" bash -c '${{ inputs.command }}' >> "$LOG_FILE" 2>&1
          EXIT_CODE=$?

          echo "" >> "$LOG_FILE"
          echo "--- EXIT CODE: $EXIT_CODE ---" >> "$LOG_FILE"

          # Save exit code and output to step outputs
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          # Truncate output for GITHUB_OUTPUT (max ~1MB safe limit)
          OUTPUT=$(head -c 500000 "$LOG_FILE")
          {
            echo "output<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          exit $EXIT_CODE

      - name: Upload command output as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command-output
          path: command-output/
          retention-days: 7

      - name: Print execution summary
        if: always()
        run: |
          echo "## Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Command** | `${{ inputs.command }}` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Working Directory** | `${{ inputs.working_directory }}` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timeout** | ${{ inputs.timeout }}s |" >> $GITHUB_STEP_SUMMARY
          echo "| **Exit Code** | `${{ steps.run-command.outputs.exit_code }}` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Output (first 5000 chars)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.run-command.outputs.output }}" | head -c 5000 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
